[build]
  publish = "."
  # Netlify descarga los grabados de Doré en cada publicación
  command = "node descargar-laminas.mjs"

[build.environment]
  NODE_VERSION = "20"

# El service worker nunca se guarda en caché, para que las actualizaciones lleguen a los celulares
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
